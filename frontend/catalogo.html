<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Catálogo — CLS Enlatados</title>
    <link rel="stylesheet" href="/src/style.css">
</head>

<body>
    <header class="header"><a class="logo" href="/">CLS <span>ENLATADOS</span></a>
        <nav><a href="/">Início</a><a class="active" href="/catalogo">Catálogo</a><a href="/sobre">Sobre</a><a
                href="/suporte">Suporte</a></nav>
        <div class="header-actions"><a href="/conta">CONTA</a><button class="cart-trigger" data-cart-open>SACOLA <b
                    data-cart-count>0</b></button><button class="menu" data-menu>☰</button></div>
    </header>
    <main>
        <section class="page-head">
            <p class="kicker">CLS ENLATADOS / CATÁLOGO</p>
            <h1>ESCOLHE A<br><em>SUA PEÇA.</em></h1>
            <p>As peças da coleção ficam aqui. Filtra, abre a peça e coloca na sacola.</p>
        </section>
        <section class="catalog-controls"><input data-search placeholder="Buscar por nome..."><select data-category>
                <option value="">Todas as categorias</option>
            </select><select data-order>
                <option value="recentes">Mais recentes</option>
                <option value="menor">Menor preço</option>
                <option value="maior">Maior preço</option>
                <option value="nome">Nome</option>
            </select></section>
        <section class="section compact">
            <div class="products" data-catalog></div>
        </section>
    </main>
    <script src="/src/script.js"></script>
</body>

</html>
