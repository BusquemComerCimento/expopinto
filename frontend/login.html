<!doctype html>
<!-- DOCUMENTAÇÃO: Esta página define a estrutura HTML da tela. O CSS controla a aparência e o JavaScript controla as interações. -->
<!-- LOGIN.HTML — Estrutura da tela. O CSS define a aparência e o JavaScript adiciona interações e comunicação com a API. -->
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Entrar — CLS Enlatados</title>
    <link rel="stylesheet" href="/src/style.css">
</head>

<body>
    <main class="auth-page"><a class="logo" href="/">CLS <span>ENLATADOS</span></a>
        <div class="auth-card">
            <p class="kicker">CLS ENLATADOS / ACESSO</p>
            <h1>ENTRA<br><em>AÍ.</em></h1>
            <form class="form" data-login-form><input name="email" type="email" placeholder="E-mail" required><input
                    name="senha" type="password" placeholder="Senha" minlength="6" required><button
                    class="button red">ENTRAR</button>
                <p data-form-message></p>
            </form>
            <p>Ainda não tem conta? <a href="/cadastro">Criar acesso.</a></p>
        </div>
    </main>
    <script src="/src/script.js"></script>
</body>

</html>
